<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="./public/icons8-star-48.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIC Lunch Retrieval</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <!-- <h1>Header</h1> -->
            <div class="header-buttons">
                <!-- Nút Text to Image -->
                <button id="textToImageBtn" class="header-btn active" title="Search in Image" data-mode="text-to-image">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search-icon lucide-search"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
                </button>
                <!-- Thêm nút Text to Text -->
                <button id="textToTextBtn" class="header-btn" title="Search in Text" data-mode="text-to-text">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-book-type-icon lucide-book-type"><path d="M10 13h4"/><path d="M12 6v7"/><path d="M16 8V6H8v2"/><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/></svg>
                </button>
                <!-- Nút Image to Image -->
                <button id="imageToImageBtn" class="header-btn" title="Search Image" data-mode="image-to-image">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21,15 16,10 5,21"/>
                    </svg>
                </button>

                <button id="translateBtn" class="header-btn" title="Enable/Disable Translation">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-languages-icon lucide-languages"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
                </button>

                <button id="tagFilterBtn" class="header-btn" title="Enable/Disable Tag Filter (F5)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-tags"><path d="M9 5H2v7l6.29 6.29c.94.94 2.48.94 3.42 0l3.58-3.58c.94-.94.94-2.48 0-3.42L9 5Z"/><path d="M6 9.01V9"/><path d="m15 5 6.3 6.3a2.69 2.69 0 0 1 0 3.79L18.02 18"/><path d="m13.5 15.5 5-5"/></svg>
                </button>
                
                <button id="settingsBtn" class="header-btn" title="Settings (F9)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings-icon lucide-settings"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>

                


            </div>
        </div>
    </header>

    <!-- Main container -->
    <div class="main-container">
        <!-- Sidebar bên trái -->
        <aside class="sidebar">
            <div class="search-container">
                <h3>SEARCH</h3>
                
                <!-- Search mode buttons (hidden by default) -->
                <div class="search-mode-buttons" id="searchModeButtons" style="display: none;">

                    <button class="mode-btn active" data-mode="text-to-image">
                        <i class="fas fa-font"></i>
                    </button>
                    <button class="mode-btn" data-mode="image-to-image">
                        <i class="fas fa-image"></i>
                    </button>

                </div>
                
                <!-- Search inputs container -->
                <div class="search-inputs-container" id="searchInputsContainer">
                    <div class="search-input-group" data-search-id="1">
                        <div class="search-box">
                            <textarea 
                                class="search-input" 
                                placeholder="Search" 
                                rows="1"
                                data-mode="text-to-image"
                            ></textarea>
                            <div class="translated-query-display"></div>
                            <!-- Image upload area (hidden by default) -->
                             
                            <div class="image-upload-area" style="display: none;">
                                <input type="file" class="image-input" accept="image/*" style="display: none;">
                                <div class="upload-zone">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                        <circle cx="8.5" cy="8.5" r="1.5"/>
                                        <polyline points="21,15 16,10 5,21"/>
                                    </svg>
                                    <p>Drag or choose image to search</p>
                                    <div class="uploaded-image" style="display: none;">
                                        <img src="" alt="Uploaded image">
                                        <button class="remove-image">×</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- <div class="search-info">
                    <p class="search-placeholder">Press Enter or Tab to create new search bar</p>
                </div> -->
            </div>
        </aside>

        <!-- Main content area -->
        <main class="main-content">
            <div class="content-area" id="contentArea">
                <div class="content-placeholder">
                    <h2>RESULTS</h2>
                    <!-- <p>Kết quả tìm kiếm sẽ hiển thị ở đây dưới dạng lưới ảnh (6 ảnh/hàng)</p> -->
                </div>
            </div>
        </main>
    </div>
    <!-- keyframe lan can popup-->
    <div id="imageModal" class="image-modal" style="display: none;">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div id="modalFrameInfo" class="modal-frame-info"></div>
            <img id="mainPreviewImage" class="main-preview" src="" alt="Main preview">
            <div class="thumbnail-strip" id="thumbnailStrip"></div>
        </div>
    </div>
    <!-- video player -->
    <div id="videoModal" class="video-modal" style="display: none;">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <button class="close-btn" id="closeVideoModalBtn">×</button>
            <video id="videoPlayer" class="video-player" controls autoplay muted>
                <source src="" type="video/mp4">
                Trình duyệt của bạn không hỗ trợ thẻ video.
            </video>
        </div>
    </div>
    <!-- Toolbar hiển thị khi có frame được chọn -->
    <div id="selectionToolbar" class="selection-toolbar">
        <div class="selection-info">
            <span class="selection-count">0</span>
            <span>frame đã chọn</span>
        </div>
        <div class="toolbar-actions">
            <button id="viewKeyframesBtn" class="toolbar-btn" data-action="view-keyframes">
                <i class="fas fa-film"></i> Xem keyframes
            </button>
            <button id="clearSelectionBtn" class="toolbar-btn" data-action="clear-selection">
                <i class="fas fa-times"></i> Bỏ chọn tất cả
            </button>
        </div>
    </div>

    <div id="settingsMenu" class="settings-menu">
        <h4>Select Model</h4>
        <ul>
            <!-- Nội dung sẽ được thêm bằng JavaScript -->
        </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
